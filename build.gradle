plugins {
    id "com.github.node-gradle.node" version "7.1.0"
    id "org.asciidoctor.jvm.convert" version "4.0.5"
    id "org.springframework.boot" version "$springBoot" apply false
    id "io.spring.dependency-management" version "1.1.7" apply false
    id 'org.sonarqube' version '7.2.2.6593'
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1" apply false
}

ext {
    operatorfabric = [
            group: 'org.opfab',
            description : 'OperatorFabric is a modular, extensible, industrial-strength platform for use in electricity, water, and other utility operations.',
            version: version = rootProject.file('VERSION').text.trim(),
            revisionDate: revisionDate = new Date().format('dd MMMM yyyy'),
            url: 'www.opfab.org'
    ]

    boot = [
            starterWeb              : "org.springframework.boot:spring-boot-starter-web:$springBoot",
            starterWebflux          : "org.springframework.boot:spring-boot-starter-webflux:$springBoot",
            actuator                : "org.springframework.boot:spring-boot-starter-actuator:$springBoot",
            starterUndertow         : "org.springframework.boot:spring-boot-starter-undertow:$springBoot",
            starterSecurity         : "org.springframework.boot:spring-boot-starter-security:$springBoot",
            starterMongo            : "org.springframework.boot:spring-boot-starter-data-mongodb:$springBoot",
            starterMongoR           : "org.springframework.boot:spring-boot-starter-data-mongodb-reactive:$springBoot",
            starterTest             : "org.springframework.boot:spring-boot-starter-test:$springBoot",
            starterValidation       : "org.springframework.boot:spring-boot-starter-validation:$springBoot",
            annotationConfiguration : "org.springframework.boot:spring-boot-configuration-processor:$springBoot"
    ]


    spring = [
            securityOauthResource   : "org.springframework.security:spring-security-oauth2-resource-server:$springSecurity",
            securityOauthJose       : "org.springframework.security:spring-security-oauth2-jose:$springSecurity",
            securityTest            : "org.springframework.security:spring-security-test:$springSecurity",
            webflux                 : "org.springframework:spring-webflux:$springWebflux"
    ]

    cloud = [
            kafkaAvroSchemaRegistryClient    : "io.confluent:kafka-schema-registry-client:$kavroSchemaRegistryClient",
            kafkaAvroSerializer              : "io.confluent:kafka-avro-serializer:$kavroAvroSerializer",
            springKafka           : "org.springframework.kafka:spring-kafka:$springKafka",

            // For testing purposes (karate kafka client)
            avro                  : "org.apache.avro:avro:$avro",
            kafkaClients          : "org.apache.kafka:kafka-clients:$kafka"
    ]

    testing_deps = [
            junit5Api       : "org.junit.jupiter:junit-jupiter-api:$junit5",
            junit5Engine    : "org.junit.jupiter:junit-jupiter-engine:$junit5",
            junit5Platform  : "org.junit.platform:junit-platform-launcher:$junitPlatformVersion",
            assertJ         : "org.assertj:assertj-core:$assertj",
            reactor         : "io.projectreactor:reactor-test:$reactor",
            karate          : "io.karatelabs:karate-junit5:$karate"
    ]


    misc = [
            slf4j          : "org.slf4j:slf4j-api:$slf4j",
            compress       : "org.apache.commons:commons-compress:$apacheCommonsCompress",
            guava          : "com.google.guava:guava:33.5.0-jre",
            jacksonAnnotations   : "com.fasterxml.jackson.core:jackson-annotations:$jacksonAnnotations",
            collections4   : "org.apache.commons:commons-collections4:$apacheCommonsCollections4",
            commonsIO      : "commons-io:commons-io:$commonsIO",
            micrometer     : "io.micrometer:micrometer-registry-prometheus:$micrometer",
            jsonSmart      : "net.minidev:json-smart:2.6.0",
            handlebars     : "com.github.jknack:handlebars:4.5.0",
            jacksonDatabind   : "com.fasterxml.jackson.core:jackson-databind:$jacksonDatabind",
            jlibmodbus     : "com.intelligt.modbus:jlibmodbus:$jlibmodbus",
            commonsText    : "org.apache.commons:commons-text:$apacheCommonsText",
            commonsLang    : "org.apache.commons:commons-lang3:$apacheCommonsLang",
            commonsPool    : "org.apache.commons:commons-pool2:$apacheCommonsPool",
            rabbitMQ       : "com.rabbitmq:amqp-client:$rabbitMQ"
    ]

    proxy = [
            https : ""
    ]
}

// override spring boot rabbitMQ version 
// we do not use rabbitMQ via spring boot 
ext['rabbit-amqp-client.version']="$rabbitMQ"
ext.proxy.https =  System.env.https_proxy != null ? "$System.env.https_proxy" : ""

sonar {
    properties {
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.organization" , "opfab"
        property "sonar.projectKey" , "org.lfenergy.operatorfabric:operatorfabric-core"
        property 'sonar.sources', 'frontend,backend/cards-external-diffusion,backend/cards-reminder,backend/supervisor,backend/common,cli'
        property 'sonar.junit.reportPaths','build/test-results/test'
        property 'sonar.coverage.jacoco.xmlReportPaths','build/reports/jacoco/xml/report.xml'
        property 'sonar.javascript.lcov.reportPaths','frontend/reports/coverage/lcov.info,backend/**/coverage/lcov.info'
        // Exlude from sonar coverage :
        // - cli/** : cli is not tested
        // - config/** : config files are not tested
        // - frontend:
        //     - frontend/src/app/modules/** : external modules are not tested
        //     - frontend/src/app/server/**, frontend/src/app/**/*Server.ts : angular server interface implementations are not tested , there will be tested via cypress e2e tests
        //     - frontend/src/app/authentication/** : authentication is not unit tested
        //     - frontend/src/app/services/** : services as there are interfaces to the back are not unit tested , there will be tested via cypress e2e tests
        //     - frontend/**/*.component.ts & frontend/**/*Component.ts : component code is not tested as the business logic shall not be in component but in view classes 
        //     - frontend/src/tests/** : tests helpers are not tested
        //     - frontend/**/*.specs.ts : tests are not tested
        //     - frontend/src/karma.conf.js : karma config files are not tested
        // - backend :
        //     - **/controllers/** : controllers are not unit tested as they are no business logic and there will be tested via cypress e2e tests and API karate test-utilities
        //     - **/repositories/** : repositories are not unit tested as they are implementations of external interfaces
        //     - **/model/**: data object with setter/getter and standard methods where unit testing has no value
        //     - **/rabbit/**: rabbitMq external interface
        //     - **/test/** : test code is not tested
        //     - backend/**/tests/* : tests are not relevant
        //     - backend/**/server-side/** : server-side files (external interfaces) are not tested , they will be tested via cypress e2e tests and API karate tests
        //     - backend/**/jest.config.js : jest config files are not tested

        def coverageExclusions = [
          'cli/**',
          'config/**',
          'frontend/src/app/server/**',
          'frontend/src/app/**/*Server.ts',
          'frontend/src/app/authentication/**',
          'frontend/src/app/services/**',
          'frontend/**/*.component.ts',
          'frontend/**/*Component.ts',
          'frontend/src/tests/**',
          'frontend/**/*.spec.ts',
          'frontend/src/karma.conf.js',
          '**/controllers/**',
          '**/tests/**',
          '**/model/**',
          '**/rabbit/**',
          '**/src/test/**',
          '**/test-utilities/**', 
          '**/repositories/**',
          'tests/**',
          'backend/**/tests/*',
          'backend/**/server-side/**',
          'backend/**/jest.config.js'
        ]
        property 'sonar.coverage.exclusions', coverageExclusions.join(',')
        property 'sonar.exclusions','**/generated/**/*,docs/**/*,**/*Application.java,**/node_modules/**/*'
        // exclusions for analyse of duplicated code , test classes are excluded 
        property 'sonar.cpd.exclusions','**/model/**/*,**/src/test/**/*,**/*.spec.ts,tests/**,backend/**/tests/*'
        

        property 'sonar.issue.ignore.multicriteria', 'e1,e2,e3,e4,e5,e6,e7'

        // ignore rule S2004 "Refactor this code to not nest functions more than 4 levels deep" for test files
        // we need to create nested test and this rule is blocking us
        property 'sonar.issue.ignore.multicriteria.e1.ruleKey', 'typescript:S2004'
        property 'sonar.issue.ignore.multicriteria.e1.resourceKey', '**/*.spec.ts'
        
        // Ignoring the rule: "Mouse events should have corresponding keyboard events"
        // Reason: There are alternative ways to ensure accessibility without providing a keyboard event for each mouse event.
        // For instance, a modal window with a close button that only responds to mouse events is not necessarily a problem,
        // provided that the modal can also be closed by pressing the Escape key.
        property 'sonar.issue.ignore.multicriteria.e2.ruleKey', 'Web:MouseEventWithoutKeyboardEquivalentCheck'
        property 'sonar.issue.ignore.multicriteria.e2.resourceKey', '**/*'

        // Ignoring the rule: "Change this code to not log user-controlled data" 
        // We are preventing log injection via specific appenders that remove new lines and carriage returns.
        property 'sonar.issue.ignore.multicriteria.e3.ruleKey', 'javasecurity:S5145'
        property 'sonar.issue.ignore.multicriteria.e3.resourceKey', '**/*'

        // Ignoring the rule "Duplicate id found" in HTML files as it is mainly false postive due to the fact that we
        // are using HTML angular templates that make conditional rendering of the elements
        // so in the majority of the cases the ids are unique at runtime
        // furthermore it is not possible to add NO SONAR directive in html files to suppress the issue
        property 'sonar.issue.ignore.multicriteria.e4.ruleKey', 'Web:S7930'
        property 'sonar.issue.ignore.multicriteria.e4.resourceKey', '**/*.html'

        // Ignoring the rule "Use `for…of` instead of `.forEach(…)`" as this recommendation is questionable
        // See https://community.sonarsource.com/t/use-for-of-instead-of-foreach-typescript-s7728/151980
        // Furthermore, we use a lot of forEach in our code base and changing all these occurrences 
        // would generate a lot of work with no real benefit
        property 'sonar.issue.ignore.multicriteria.e5.ruleKey', 'typescript:S7728'
        property 'sonar.issue.ignore.multicriteria.e5.resourceKey', '**/*'

        // Ignoring the rule "Label elements should have a text label and an associated control (Web:S6853)"
        // This rule does not apply to our project because our custom input components do not use a label as a direct ancestor of the input element.
        // Addressing this would require a major redesign of all input components and force all OpFab users to update their templates.
        // The required effort outweighs the potential benefit, so we are choosing to ignore this rule.
        property 'sonar.issue.ignore.multicriteria.e6.ruleKey', 'Web:S6853'
        property 'sonar.issue.ignore.multicriteria.e6.resourceKey', '**/*'

        // Ignoring the rule "Prefer top-level await over using a promise chain (typescript:S7785)"
        // The use of await at the top level implies to modify ts configuration of our node project
        // I did not succeed to find the correct configuration , so for now we disable the rule
        property 'sonar.issue.ignore.multicriteria.e7.ruleKey', 'typescript:S7785'
        property 'sonar.issue.ignore.multicriteria.e7.resourceKey', '**/*'

    }
}
// All builds should be done before sonar analysis
tasks.named('sonar') {
    dependsOn 'frontend:runBuild'
    dependsOn 'backend:cards-external-diffusion:test'
    dependsOn 'backend:cards-reminder:test'
    dependsOn 'backend:supervisor:test'
    dependsOn 'backend:node-common:test'
    dependsOn 'backend:cards-publication:test'
    dependsOn 'backend:cards-consultation:test'
    dependsOn 'backend:businessconfig:test'
    dependsOn 'backend:users:test'
    dependsOn 'backend:external-devices:test'
}


//tag::asciidoctor_gradle_task_config[]
asciidoctor {

    baseDirFollowsSourceFile()

    sourceDir 'docs/asciidoc'

    sources {
        include '*/index.adoc','docs/*'
    }
    resources {
        from('docs/asciidoc') {
            include 'images/*','pdf/*'
        }
    }
    
    // Declare inputs and outputs for Gradle build cache
    inputs.dir 'docs/asciidoc'
    inputs.files fileTree('docs/asciidoc') { include '*/index.adoc','docs/*','images/*','pdf/*' }
    outputs.dir "${buildDir}/docs/asciidoc"

    // This is done to fetch the correct version for links that reference source files.
    // The reference is set to develop if on develop branch for snapshot
    // else it's set on latest release tag
    doFirst {
        def currentBranchProcess = ['sh', '-c', 'git rev-parse --abbrev-ref HEAD'].execute()
        currentBranchProcess.waitFor()
        def currentBranch = currentBranchProcess.text.trim()
        
        def gitReference
        
        if (currentBranch == "develop") {
            gitReference = "develop"
        } else {
            def latestTagProcess = ['sh', '-c', 'git tag -l --sort=-creatordate | head -n 1'].execute()
            latestTagProcess.waitFor()
            gitReference = latestTagProcess.text.trim()
        }
        
        attributes('gitReference': gitReference)
    }

    attributes  nofooter            : '',
            revnumber           : operatorfabric.version,
            revdate             : operatorfabric.revisionDate,
            sectnums            : '',
            sectnumlevels       : '4',
            sectanchors         : '',
            toc                 : 'left',
            toclevels           : '4',
            icons               : 'font',
            imagesdir           : '../images',
            "hide-uri-scheme"   : '',
            "source-highlighter": 'coderay'
}
//end::asciidoctor_gradle_task_config[]

subprojects {
    group = operatorfabric.group
    version = operatorfabric.version
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
