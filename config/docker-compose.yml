services:
  mongodb:
    container_name: mongodb
    image: mongo:7.0.30-jammy
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password # !!! TO BE CHANGED THIS IS ONLY FOR TEST AND DEMONSTRATION !!!
    volumes:
      - "./mongodump:/dump"
  rabbitmq:
    container_name: rabbit
    image: "lfeoperatorfabric/of-rabbitmq:SNAPSHOT"
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_PASS: for_test_only # !!! TO BE CHANGED THIS IS ONLY FOR TEST AND DEMONSTRATION !!!

    #  If you want to persist queue after rabbit docker container removal mount
    #  a volume to store persistance data
    #  WARNING : On Kubernetes , as pod are destroy , it is
    #  necessary to persist queue . Otherwise in case of restart of
    #  the rabbit pod, the connection with cards-consultation will be lost
    #
    #    volumes:
    #      - "./rabbit-persistance:/var/lib/rabbitmq/mnesia/"

    #    !!! WARNING !!!
    #    Port is to be closed for security reasons , be careful if you open it
    #    Port open here for dev only
    ports:
      - "5672:5672"
  #      - "15672:15672"

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.5
    environment:
      # Enable health and metrics support
      - KC_HTTP_PORT=89
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KEYCLOAK_ADMIN=admin # !!! TO BE CHANGED THIS IS ONLY FOR TEST AND DEMONSTRATION !!!
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_RELATIVE_PATH=/auth
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    command:
      - -v
      - start-dev
      - --import-realm
    ports:
      - "89:89"
    mem_limit: 1g
  greenmail:
    container_name: greenmail
    image: greenmail/standalone:2.1.8
    ports:
      - 3025:3025
      - 3143:3143
      - 8080:8080
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # port 9092 for accessing kafka from host machine and port 29092 for accessing kafka from other containers in the same docker network
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  users:
    container_name: users
    image: "lfeoperatorfabric/of-users:SNAPSHOT"
    depends_on:
      - mongodb
      - rabbitmq
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2103:2103"
    #    Debug port closed for security reasons, be careful if you open it
    #     - "4103:5005"
    volumes:
      - "./certificates:/certificates_to_add"
      - "./services/users.yml:/config/application.yml"
      - "./services/common.yml:/config/common.yml"
  businessconfig:
    container_name: businessconfig
    image: "lfeoperatorfabric/of-businessconfig:SNAPSHOT"
    depends_on:
      - mongodb
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2100:2100"
    #    Debug port closed for security reasons, be careful if you open it
    #     - "4100:5005"
    volumes:
      - "./certificates:/certificates_to_add"
      - "./businessconfig-storage:/businessconfig-storage"
      - "./services/common.yml:/config/common.yml"
      - "./services/businessconfig.yml:/config/application.yml"
  cards-publication:
    container_name: cards-publication
    image: "lfeoperatorfabric/of-cards-publication:SNAPSHOT"
    depends_on:
      - mongodb
      - rabbitmq
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2102:2102"
    #    Debug port closed for security reasons, be careful if you open it
    #     - "4102:5005"
    volumes:
      - "./certificates:/certificates_to_add"
      - "./services/common.yml:/config/common.yml"
      - "./services/cards-publication.yml:/config/application.yml"
  cards-consultation:
    container_name: cards-consultation
    image: "lfeoperatorfabric/of-cards-consultation:SNAPSHOT"
    depends_on:
      - mongodb
      - rabbitmq
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2104:2104"
    #    Debug port closed for security reasons, be careful if you open it
    #     - "4104:5005"

    volumes:
      - "../certificates:/certificates_to_add"
      - "./services/common.yml:/config/common.yml"
      - "./services/cards-consultation.yml:/config/application.yml"
  web-ui:
    container_name: web-ui
    image: "lfeoperatorfabric/of-web-ui:SNAPSHOT"
    ports:
      - "2002:80"
        # To avoid resolving hostname in docker network for nginx
        # you may need to start wev-ui after other services
        # you cand do that with the following configuration line
        #
    #    depends_on:
    #      - users
    #      - businessconfig
    #      - cards-consultation
    volumes:
      - "./web-ui/ui-config:/usr/share/nginx/html/config"
      - "./web-ui/nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./web-ui/externalJs:/usr/share/nginx/html/externalJs"
      - "./web-ui/externalCss:/usr/share/nginx/html/externalCss"
      - "../tests/externalWebAppExample:/usr/share/nginx/html/external/appExample"
  # Uncomment the line below to customize sounds for notification
  #   - "./services/custom-sounds:/usr/share/nginx/html/assets/sounds"
  email-gateway:
    container_name: email-gateway
    image: "lfeoperatorfabric/of-email-gateway:SNAPSHOT"
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2106:2106"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=base,common,docker
    volumes:
      - "./services/email-gateway.yml:/usr/app/config/docker.yml"
      - "./services/common.yml:/usr/app/config/common.yml"
      - "./services/customHandlebarsHelpersExample.js:/usr/app/config/customHandlebarsHelpersExample.js"
  cards-reminder:
    container_name: cards-reminder
    image: "lfeoperatorfabric/of-cards-reminder:SNAPSHOT"
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2107:2107"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=base,common,docker
    volumes:
      - "./services/cards-reminder.yml:/usr/app/config/docker.yml"
      - "./services/common.yml:/usr/app/config/common.yml"
  supervisor:
    container_name: supervisor
    image: "lfeoperatorfabric/of-supervisor:SNAPSHOT"
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2108:2108"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=base,common,docker
    volumes:
      - "./services/supervisor.yml:/usr/app/config/docker.yml"
      - "./services/common.yml:/usr/app/config/common.yml"
  external-devices:
    container_name: external-devices
    image: "lfeoperatorfabric/of-external-devices:SNAPSHOT"
    depends_on:
      - mongodb
    user: ${USER_ID}:${USER_GID}
    ports:
      - "2105:2105"
    #    Debug port closed for security reasons, be careful if you open it
    #     - "4105:5005"
    volumes:
      - "./certificates:/certificates_to_add"
      - "./services/common.yml:/config/common.yml"
      - "./services/external-devices.yml:/config/application.yml"

  #### Dummy services for dev/tests purposes - NOT FOR PRODUCTION ####
  # External application example
  ext-app:
    container_name: external-app
    image: "lfeoperatorfabric/of-external-app:SNAPSHOT"
    ports:
      - "8090:8090"
    volumes:
      - "./certificates:/certificates_to_add"
      - "./services/common.yml:/config/common.yml"
  # Dummy external devices using Modbus Protocol
  dummy-modbus-device_1:
    container_name: dummy-modbus-device_1
    image: "lfeoperatorfabric/of-dummy-modbus-device:SNAPSHOT"
    user: ${USER_ID}:${USER_GID}
    ports:
      - "4031:4030"
    volumes:
      - "./certificates:/certificates_to_add"
  dummy-modbus-device_2:
    container_name: dummy-modbus-device_2
    image: "lfeoperatorfabric/of-dummy-modbus-device:SNAPSHOT"
    user: ${USER_ID}:${USER_GID}
    ports:
      - "4032:4030"
    volumes:
      - "../certificates:/certificates_to_add"
