apply plugin: 'java'
apply plugin: 'jacoco'

dependencies {

    implementation misc.jsonSmart
    implementation boot.starterMongo
    implementation 'org.mongodb:mongodb-driver-sync:5.7.0' //Needed for mongo imperative operations, as spring-boot-starter-data-mongodb-reactive does not include it
    implementation boot.starterValidation
    implementation boot.starterSecurity
    implementation boot.starterWeb
    implementation spring.securityOauthResource , spring.securityOauthJose

    implementation misc.compress
    implementation misc.rabbitMQ
    implementation misc.commonsPool
    implementation misc.commonsText
    implementation misc.handlebars

    testImplementation testing_deps.junit5Api
    testImplementation testing_deps.assertJ

    testRuntimeOnly testing_deps.junit5Engine
    testRuntimeOnly testing_deps.junit5Platform
}

test {
    useJUnitPlatform()
    testLogging {
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "full"
    }
    filter {
        includeTestsMatching "*Should"
    }
}
jacocoTestReport {
    group = "Reporting"
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = file("${buildDir}/reports/coverage")
    }
}

task prepareTestData(type: Copy){
    description 'copy test data to build/test-data/'
    from 'src/test/data/simple'
    into 'build/test-data'
    doFirst{
        logger.info "src/test/data/* to build/test-data/"
    }
}

task compressTestArchive(type: Exec){
    description 'compress the contents of /src/test/data/archive to /build/test-data/archive.tar.gz'
    workingDir "$project.projectDir/src/test/data/archive"
    executable "bash"
    args "-c", "tar -czf $project.projectDir/build/test-data/archive.tar.gz *"
}

test.dependsOn(prepareTestData)
test.dependsOn(compressTestArchive)
compressTestArchive.dependsOn(prepareTestData)
tasks.jacocoTestReport.dependsOn test



