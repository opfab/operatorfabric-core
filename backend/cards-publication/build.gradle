plugins {
    id "com.github.davidmc24.gradle.plugin.avro"
}

apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'

dependencies {
    implementation misc.jsonSmart
    implementation misc.commonsLang
    implementation cloud.springKafka
    implementation cloud.kafkaAvroSchemaRegistryClient
    implementation cloud.kafkaAvroSerializer
    implementation boot.actuator
    implementation misc.micrometer
    implementation spring.securityOauthResource, spring.securityOauthJose
    implementation boot.starterWeb
    implementation boot.starterSecurity
    implementation boot.starterValidation
    implementation boot.starterMongo
    implementation project(':backend:java-common')

//Transitive dependencies udpate needed for security reasons 
    implementation misc.guava
    implementation misc.compress
//End transitive dependencies


    compileOnly boot.annotationConfiguration
    annotationProcessor boot.annotationConfiguration

    testImplementation spring.securityTest
    testImplementation boot.starterTest, testing_deps.assertJ
    testImplementation project(':backend:test-utilities')

}

tasks.named("processResources") {
    duplicatesStrategy = 'include'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources{
            srcDir 'src/main/resources'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "full"
    }
    filter {
        includeTestsMatching "*Should"
    }
}


jacocoTestReport {
    group = "Reporting"
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = file("${buildDir}/reports/jacoco/html")
        xml.outputLocation = file("${buildDir}/reports/jacoco/xml/report.xml")
    }
}

task buildDocker(type: Exec) {
    workingDir project.projectDir
    commandLine 'docker', 'build', 
                '--build-arg', "https_proxy=${proxy.https}",
                '--build-arg', "JAR_FILE=${project.name.toLowerCase()}-${project.version.toUpperCase()}.jar",
                '-t', "lfeoperatorfabric/of-${project.name}:${project.version}", '.'
}

task copyScriptsForDockerImage(type: Copy) {
    description 'copy script for docker image'
    from "$project.projectDir/../java-common/add-certificates.sh"
    from "$project.projectDir/../java-common/java-config-docker-entrypoint.sh"
    into "$project.projectDir/build/docker"
    doFirst {
        logger.info "creating $project.projectDir/build/dockerFiles/"
        new File("$project.projectDir/build/docker/").mkdirs()
    }
}

avro {
    createSetters = true
    fieldVisibility = "PRIVATE"
    stringType = "String"
}

tasks.buildDocker.dependsOn copyScriptsForDockerImage
tasks.buildDocker.dependsOn build
tasks.jacocoTestReport.dependsOn test
