@if(!technicalError) {
<div style="background-color: var(--opfab-bgcolor-darker); border: solid 5px var(--opfab-bgcolor-darker)">
    @if(canAddItems && !this.isLoadingData) {
    <div style="padding: 10px">
        <a class="btn btn-primary" (click)="createNewItem()" id="addItem">
            <em class="fas fa-plus-circle"></em>
        </a>
        <span>&nbsp;<label for="addItem" translate> {{addItemLabel}} </label></span>
    </div>
    <br />
    } @if(showSpinner) {
    <of-spinner [seeInModal]="true"></of-spinner>
    }

    <ag-grid-angular
        id="opfab-externaldevices-table-grid"
        aria-describedby="External devices table"
        (gridReady)="onGridReady($event)"
        [gridOptions]="gridOptions"
        [rowData]="this.configurations"
        class="ag-theme-opfab"
        [enableCellTextSelection]="true">
    </ag-grid-angular>

    @if(gridApi) {
    <div class="opfab-pagination">
        <div style="white-space: nowrap; margin-top: 17px">
            <span translate> shared.resultsNumber </span> : {{gridApi.paginationGetRowCount()}}
        </div>
        <div style="width: 40%; margin-top: 5px">
            @if(gridApi.paginationGetRowCount() > pageSize) {
            <ngb-pagination
                [collectionSize]="gridApi.paginationGetRowCount()"
                [page]="page"
                [pageSize]="gridApi.paginationGetPageSize()"
                (pageChange)="updateResultPage($event)"
                [maxSize]="3"
                [rotate]="true">
            </ngb-pagination>
            }
        </div>

        <div style="width: 100%; display: flex; justify-content: flex-end; margin-top: 10px; margin-right: 20px">
            <div id="opfab-externaldevices-btn-exportToExcel" style="cursor: pointer" (click)="export()">
                <span class="opfab-icon-export-data"></span>
                <span style="font-weight: bold" translate>shared.exportToExcel</span>
            </div>
        </div>
    </div>
    }
</div>
} @else {
<div style="text-align: center; font-size: 20px" translate><br /><br />shared.error.technicalError</div>
}
