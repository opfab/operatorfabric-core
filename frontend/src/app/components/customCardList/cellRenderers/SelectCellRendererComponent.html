<div [hidden]="!isInputFieldVisible" style="margin: 1px; align-items: center">
    <select
        [hidden]="showOtherInput"
        id="opfab-customcardlist-select"
        [formControl]="cardSelectControl"
        (change)="onSelectChange($event)"
        (keydown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="opfab-select"
        style="height: 35px; width: 80%">
        @for (option of selectOptions; track option) {
        <option [value]="option.value">{{ option.label }}</option>
        } @if (allowNewOptionForSelect) {
        <option value="__other__">{{ otherOptionLabel }}</option>
        }
    </select>
    <div class="input-container">
        @if (showOtherInput) {
        <input
            #otherInput
            type="text"
            [formControl]="otherInputControl"
            [attr.maxlength]="maxLength > 0 ? maxLength : null"
            (input)="onInput($event)"
            (blur)="addOtherOption()"
            (keydown.enter)="addOtherOption()"
            (keydown.esc)="cancelOtherInput()"
            (click)="$event.stopPropagation()"
            placeholder="{{ otherOptionPlaceholder }}"
            class="opfab-input"
            style="height: 35px; width: 100%" />
        } @if (maxLength>0 && showOtherInput) {
        <span class="char-count"> {{ charCount }} </span>
        }
    </div>
</div>

@if (!isInputFieldVisible) {
<div style="margin: 0px; align-items: center; text-overflow: ellipsis; overflow: hidden; white-space: nowrap">
    {{ fieldLabel }}
</div>
}
