<svg
    [attr.width]="timeLineWidth"
    [attr.height]="timeLineHeight"
    (wheel)="onMouseWheel($event)"
    style="overflow: visible">
    <g transform="translate(10,30)">
        <!-- Background rectangle for 7D and W domain -->
        @for (rectangle of timeLineView.getDayRectangles(); track rectangle) {
        <g>
            @if (rectangle.changeBgColor) {
            <rect
                [attr.x]="getXCoordinate(rectangle.start)"
                [attr.width]="getXCoordinate(rectangle.end) - getXCoordinate(rectangle.start)"
                y="0"
                fill="var(--opfab-timeline-week-bgcolor)"
                [attr.height]="gridHeight"></rect>
            } @if (rectangle.changeBgColor) {
            <text
                [attr.x]="(getXCoordinate(rectangle.end) + getXCoordinate(rectangle.start)) / 2"
                [attr.y]="53"
                fill="var(--opfab-timeline-week-color)"
                text-anchor="middle"
                [attr.font-size]="15"
                stroke-width="0.5px">
                {{ rectangle.dateToDisplay }}
            </text>
            } @if (!rectangle.changeBgColor) {
            <text
                [attr.x]="(getXCoordinate(rectangle.end) + getXCoordinate(rectangle.start)) / 2"
                [attr.y]="53"
                fill="var(--opfab-timeline-week-color2)"
                text-anchor="middle"
                [attr.font-size]="15"
                stroke-width="0.5px">
                {{ rectangle.dateToDisplay }}
            </text>
            }
        </g>
        }

        <!-- Y axis grid lines -->
        <g>
            <rect
                [attr.x]="0"
                [attr.width]="gridWidth"
                [attr.y]="gridHeight - 2"
                fill="#B1B1B1"
                [attr.height]="2"></rect>
            @for (i of [0,1,2,3,4]; track i) {
            <line
                [attr.x1]="0"
                [attr.x2]="gridWidth"
                [attr.y1]="gridHeight * i / 5"
                [attr.y2]="gridHeight * i / 5"
                stroke="var(--opfab-timeline-grid-color)"
                stroke-width="0.5px" />
            }
        </g>

        <!-- X axis with labels and vertical bars-->

        <g id="opfab-timeline-xaxis">
            <rect [attr.x]="0" [attr.width]="2" y="0" fill="#B1B1B1" [attr.height]="gridHeight"></rect>
            @for (tick of timeLineView.getXTicks(); track tick) {
            <g>
                <line
                    [attr.x1]="getXCoordinate(tick)"
                    [attr.x2]="getXCoordinate(tick)"
                    [attr.y1]="0"
                    [attr.y2]="gridHeight"
                    stroke="var(--opfab-timeline-grid-color)"
                    stroke-width="0.5px" />
                <text
                    [attr.x]="getXCoordinate(tick)"
                    [attr.y]="gridHeight + 15"
                    text-anchor="middle"
                    fill="var(--opfab-timeline-grid-text-color)"
                    [attr.font-size]="12">
                    {{ timeLineView.getXTickLabel(tick) }}
                </text>
            </g>
            }
            <rect [attr.x]="gridWidth - 2" [attr.width]="2" y="0" fill="#B1B1B1" [attr.height]="gridHeight"></rect>
        </g>

        <!-- TIMELINE REAL TIME BAR -->
        <!-- no rounded only up corner possible with svg so use two rectangles -->
        @if (isRealTimeBarVisible()) {
        <g>
            <rect
                [attr.x]="getRealTimeBarTextPosition() - 50"
                [attr.width]="100"
                y="-18"
                fill="var(--opfab-timeline-realtimebar-color)"
                [attr.height]="18"
                rx="10"
                ry="10"></rect>
            <rect
                [attr.x]="getRealTimeBarTextPosition() - 50"
                [attr.width]="100"
                y="-10"
                fill="var(--opfab-timeline-realtimebar-color)"
                [attr.height]="10"></rect>
            <text
                [attr.x]="getRealTimeBarTextPosition()"
                [attr.y]="-8"
                fill="var(--opfab-timeline-text-color)"
                text-anchor="middle"
                stroke-width="0.5px"
                [attr.font-size]="13"
                dy=".3em"
                id="opfab-timeline-time-cursor">
                {{ getRealTimeBarText() }}
            </text>
            <rect
                [attr.x]="getXCoordinate(xRealTimeLine)"
                [attr.width]="2"
                y="0"
                fill="var(--opfab-timeline-realtimebar-color)"
                [attr.height]="gridHeight"></rect>
        </g>
        }

        <!-- TIMELINE TITLE -->
        <text
            [attr.x]="'50%'"
            [attr.y]="-27"
            fill="var(--opfab-timeline-text-color)"
            text-anchor="middle"
            [attr.font-size]="13"
            dy=".3em"
            id="opfab-timeline-title">
            {{ getTimeLineTitle() }}
        </text>

        <!-- CIRCLES -->
        @for (circle of circles$ | async; track circle; let index = $index) {
        <g type="button">
            <g
                id="opfab-timelineCircle-{{ index }}"
                (click)="onCircleClick(circle)"
                (mouseenter)="circleHovered(circle, p1)"
                (mouseleave)="onMouseLeave()"
                container="body"
                #p1="ngbPopover"
                [ngbPopover]="tooltipTemplate"
                [autoClose]="false"
                triggers="mouseenter"
                popoverClass="opfab-popover opfab-popover-with-scrolling">
                <ellipse
                    [attr.cx]="getXCoordinate(circle.date)"
                    [attr.cy]="getYCoordinate(circle.circleYPosition)"
                    [attr.ry]="'10'"
                    [attr.rx]="circle.width"
                    [attr.fill]="circle.color"
                    [attr.stroke]="'stroke'" />
                <text
                    [attr.x]="getXCoordinate(circle.date)"
                    [attr.y]="getYCoordinate(circle.circleYPosition)"
                    text-anchor="middle"
                    stroke-width="0px"
                    fill="white"
                    font-weight="bold"
                    [attr.font-size]="15"
                    dy=".3em">
                    {{ circle.count }}
                </text>
            </g>
        </g>
        }
    </g>
</svg>
<ng-template #tooltipTemplate>
    <div
        (mouseenter)="onMouseEnter()"
        (mouseleave)="openPopover.close()"
        style="padding: 10px; overflow-y: auto; max-height: 500px">
        @for (title of currentCircleHovered.summary; track title; let i = $index) {
        <div style="padding: 0px; margin: 0px; line-height: 8px">
            @if (i > 0) {
            <br />
            }
            <button
                [id]="'opfab-timeline-bubble-btn' + i"
                class="btn btn-cardlink btn-sm"
                (click)="showCard(title.cardId)"
                style="width: 100%">
                <div style="text-align: left" class="opfab-bubble-text">
                    {{ title.summaryDate }} {{ title.titleTranslated }}
                </div>
            </button>
        </div>
        }
    </div>
</ng-template>
