<svg width="28" height="28" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">

    <g transform="translate(24,24) rotate(90) translate(-24,-24)">
        <!-- First rectangle (top before rotation) -->
        <!-- Top horizontal line split into two segments -->
        <line x1="4" y1="6" x2="14" y2="6" stroke="black" stroke-width="2" />
        <line x1="34" y1="6" x2="44" y2="6" stroke="black" stroke-width="2" />

        <!-- Left and right sides -->
        <line x1="4" y1="6" x2="4" y2="22" stroke="black" stroke-width="2" />
        <line x1="44" y1="6" x2="44" y2="22" stroke="black" stroke-width="2" />

        <!-- Bottom line -->
        <line x1="4" y1="22" x2="44" y2="22" stroke="black" stroke-width="2" />

        <!-- Second rectangle below -->
        <rect x="4" y="22" width="40" height="20" fill="none" stroke="black" stroke-width="2" />

        <!-- Plus sign in the erased space -->
        <!-- Horizontal line -->
        <line x1="18" y1="6" x2="30" y2="6" stroke="black" stroke-width="2" />
        <!-- Vertical line -->
        <line x1="24" y1="0" x2="24" y2="12" stroke="black" stroke-width="2" />
    </g>

</svg>
