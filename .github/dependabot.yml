version: 2
updates:
  - package-ecosystem: "npm"
    cooldown:
      semver-major-days: 5
      semver-minor-days: 2
    directory: "/frontend/"
    groups:
      angular:
        patterns:
          - "@angular*"
      fullcalendar:
        patterns:
          - "@fullcalendar*"
      ag-grid:
        patterns:
          - "ag-grid*"
      eslint:
        patterns:
          - "*eslint*"
      stylelint:
        patterns:
          - "*stylelint*"
    schedule:
      interval: "daily"
    # Ignore major Angular version updates because they require manual intervention
    # following the official Angular upgrade guide, which Dependabot cannot automate.
    ignore:
      - dependency-name: "@angular*"
        update-types:
          - "version-update:semver-major"
