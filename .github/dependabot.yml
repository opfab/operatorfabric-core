version: 2
updates:
  - package-ecosystem: "npm"
    cooldown:
      semver-major-days: 5
      semver-minor-days: 2
    directory: "/ui/main/"
    groups:
      angular:
        patterns:
          - "@angular*"
      fullcalendar:
        patterns:
          - "@fullcalendar*"
      ag-grid:
        patterns:
          - "ag-grid*"
      eslint:
        patterns:
          - "*eslint*"
      stylelint:
        patterns:
          - "*stylelint*"
    schedule:
      interval: "daily"
