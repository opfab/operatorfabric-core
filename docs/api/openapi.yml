      "/users/users":
        {
          "get":
            {
              "tags": ["users"],
              "summary": "Get a list of all existing users",
              "description": "Get a list of all existing users, with pagination and filter options",
              "operationId": "getUsers",
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    { "$ref": "#/components/schemas/User" },
                                },
                              "examples":
                                {
                                  "response":
                                    {
                                      "value":
                                        [
                                          {
                                            "login": "jcleese",
                                            "firstName": "John",
                                            "lastName": "Cleese",
                                            "groups": ["MONTY", "WANDA"],
                                            "entities": ["ENITY1", "ENTITY2"],
                                          },
                                          {
                                            "login": "gchapman",
                                            "firstName": "Graham",
                                            "lastName": "Chapman",
                                            "groups": ["MONTY"],
                                            "entities": ["ENITY1"],
                                          },
                                        ],
                                    },
                                },
                            },
                        },
                    },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Authenticated users who are not admins can only access their own data",
                    },
                },
            },
          "post":
            {
              "tags": ["users"],
              "summary": "Post a new user",
              "description": "Create a new user. If the user already exists, then an update of the user will be made. Be careful, login must be minimum 2 characters and must only contain lowercase letters, _, -, . or digits.",
              "operationId": "createUser",
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/User" } },
                    },
                  "description": "User to be created",
                },
