  "paths":
    {
      "/cards-consultation/cards/{id}":
        {
          "parameters":
            [
              {
                "in": "path",
                "name": "id",
                "required": true,
                "description": "DEPRECATED: Use /cards-consultation/cards?cardId={id} instead. The id parameter is constructed as follows : {process}.{processInstanceId}. Note: This endpoint has issues with special characters, particularly slashes, even when URL-encoded.",
                "schema": { "type": "string" },
              },
            ],
          "get":
            {
              "deprecated": true,
              "operationId": "getCardDeprecated",
              "tags": ["cards consultation"],
              "summary": "Get card (DEPRECATED)",
              "description": "DEPRECATED: Use GET /cards-consultation/cards?cardId={id} instead. This endpoint is deprecated because it cannot properly handle card IDs containing slashes (/) even when URL-encoded. Get card with its id",
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "*/*":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "card":
                                        { "$ref": "#/components/schemas/Card" },
                                      "childCards":
                                        {
                                          "type": "array",
                                          "items":
                                            {
                                              "$ref": "#/components/schemas/Card",
                                            },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Forbidden - User doesn't have any group",
                    },
                  "404": { "description": "Card not found" },
                },
            },
        },
      "/cards-consultation/cards":
        {
          "get":
            {
              "operationId": "getCardByQueryParam",
              "tags": ["cards consultation"],
              "summary": "Get card by ID (query parameter)",
              "description": "Get card with its id passed as a query parameter. This endpoint properly handles card IDs with special characters including slashes.",
              "parameters":
                [
                  {
                    "in": "query",
                    "name": "cardId",
                    "required": true,
                    "description": "The card ID constructed as follows : {process}.{processInstanceId}. This parameter handles all special characters including slashes.",
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "*/*":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "card":
                                        { "$ref": "#/components/schemas/Card" },
                                      "childCards":
                                        {
                                          "type": "array",
                                          "items":
                                            {
                                              "$ref": "#/components/schemas/Card",
                                            },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Forbidden - User doesn't have any group",
                    },
                  "404": { "description": "Card not found" },
                },
            },
          "post":
            {
              "tags": ["cards consultation"],
              "summary": "Get cards matching given criteria",
              "description": "Get published cards matching the criteria given as parameters. Results are limited to the cards that the calling user is allowed to see (based on the card recipients). For performance reasons, the response  does not contain all lightCard fields, the returned fields are : id, uid,publisher, processVersion,process, processInstanceId,state,title,summary,publishDate,startDate,endDate,severity, publisherType, representative,representativeType. The other fields are set to null.",
              "operationId": "getCards",
              "requestBody":
                { "$ref": "#/components/requestBodies/CardsFilter" },
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "*/*":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/LightCardPage",
                                },
                            },
                        },
                    },
                  "400": { "description": "Bad request" },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Forbidden - User doesn't have any group",
                    },
                },
            },
        },
      "/cards-consultation/cardSubscription":
        {
          "get":
            {
              "tags": ["cards consultation"],
              "summary": "Get card subscription",
              "description": "Get cards restricted to calling user. Cards all come with empty data and details. requesting this end point opens an SSE connection",
              "operationId": "getCardSubscription",
              "parameters":
                [
                  {
                    "name": "rangeStart",
                    "in": "query",
                    "description": "start of time range to get published card",
                    "schema": { "type": "string", "format": "date-time" },
                  },
                  {
                    "name": "rangeEnd",
                    "in": "query",
                    "description": "end of time range to get published card",
                    "schema": { "type": "string", "format": "date-time" },
                  },
                  {
                    "name": "notification",
                    "in": "query",
                    "description": "If true, connection is kept for notification of new cards (not related to the specified range)",
                    "schema": { "type": "boolean", "default": false },
                  },
                  {
                    "name": "clientId",
                    "in": "query",
                    "description": "A unique id to identify client to allow for reconnection (an autogenerated UUID is the best solution)",
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "processStatesAlwaysLoaded",
                    "in": "query",
                    "description": "Semicolon-separated list of process.state pairs to send even if the user has configured notification to be disabled for these process/states (e.g., process1.state1;process2.state2)",
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "ok",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    {
                                      "$ref": "#/components/schemas/CardOperation",
                                    },
                                },
                            },
                        },
                    },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Forbidden - User doesn't have any group",
                    },
                },
            },
        },
      "/cards-consultation/cardSubscription/{uiId}":
        {
          "post":
            {
              "tags": ["cards consultation"],
              "summary": "Update existing subscription",
              "description": "Update existing subscription",
              "operationId": "postCardSubscription",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "uiId",
                    "description": "unique ui client id associated to subscription",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/Subscription" },
                        },
                    },
                  "description": "updated subscription",
                },
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Subscription" },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Bad request (body doesn't match login path parameter)",
                    },
                  "401": { "description": "Authentication required" },
                  "404": { "description": "Subscription not found" },
                },
            },
        },
      "/cards-consultation/archives/{id}":
