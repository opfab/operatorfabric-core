      "/cards-publication/cards/userAcknowledgement":
        {
          "post":
            {
              "operationId": "postUserAcknowledgement",
              "tags": ["cards publication"],
              "summary": "Update current card adding a user acknowledgement",
              "description": "Update current card users acknowledgements, adding a new item, by card uid and authenticated user",
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "cardUid":
                                    {
                                      "type": "string",
                                      "description": "The card uid",
                                    },
                                  "entitiesAcks":
                                    {
                                      "type": "array",
                                      "items": { "type": "string" },
                                      "description": "List of entity IDs",
                                    },
                                },
                              "required": ["cardUid", "entitiesAcks"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "No action done, the item already exists",
                    },
                  "201": { "description": "Created" },
                  "404":
                    {
                      "description": "Try to remove item from non-existing card",
                    },
                },
            },
        },
      "/cards-publication/cards/cancelUserAcknowledgement":
        {
          "post":
            {
              "operationId": "deleteUserAcknowledgement",
              "tags": ["cards publication"],
              "summary": "Update current card removing a user acknowledgement",
              "description": "Update current card users acknowledgements, removing an item, by card uid and authenticated user",
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "cardUid":
                                    {
                                      "type": "string",
                                      "description": "The card uid",
                                    },
                                  "entitiesAcks":
                                    {
                                      "type": "array",
                                      "items": { "type": "string" },
                                      "description": "List of entity IDs",
                                    },
                                },
                              "required": ["cardUid", "entitiesAcks"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200": { "description": "Item removed" },
                  "204": { "description": "Try to remove non-existing item" },
                  "404":
                    {
                      "description": "Try to remove item from non-existing card",
                    },
                },
            },
        },
