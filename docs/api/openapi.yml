                    {
                      "description": "Forbidden - User doesn't have any group",
                    },
                },
            },
        },
      "/cards-publication/cards":
        {
          "post":
            {
              "tags": ["cards publication"],
              "summary": "Post card",
              "description": "Publish one card to OperatorFabric",
              "operationId": "postCard",
              "requestBody": { "$ref": "#/components/requestBodies/Card" },
              "responses":
                {
                  "201":
                    {
                      "description": "created",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/CardCreationReport",
                                },
                            },
                        },
                    },
                  "400": { "description": "bad request" },
                },
            },
          "patch":
            {
              "tags": ["cards publication"],
              "summary": "Patch existing card",
              "description": "Patch existing card",
              "operationId": "patchCard",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "description": "card id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/Card" } },
                    },
                  "description": "card containing fields to be updated",
                },
              "responses":
                {
                  "200":
                    {
                      "description": "OK",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/CardCreationReport",
                                },
                            },
                        },
                    },
                  "400": { "description": "Bad request" },
                  "401": { "description": "Authentication required" },
                  "404": { "description": "Card not found" },
                },
            },
          "delete":
            {
              "tags": ["cards publication"],
              "summary": "Delete cards",
              "description": "Delete cards from OperatorFabric. Two modes: 1) Delete a specific card by providing 'cardId' parameter (properly handles special characters including slashes), 2) Bulk delete cards by providing 'endDateBefore' parameter to delete cards where endDate is before the specified date or where card has no endDate and startDate is before the specified date.",
              "operationId": "deleteCards",
              "parameters":
                [
                  {
                    "in": "query",
                    "name": "cardId",
                    "description": "The card ID to delete, constructed as follows : {process}.{processInstanceId}. This parameter handles all special characters including slashes. Mutually exclusive with endDateBefore.",
                    "schema": { "type": "string" },
                    "required": false,
                  },
                  {
                    "in": "query",
                    "name": "endDateBefore",
                    "description": "Delete all cards where endDate is before this timestamp, or where card has no endDate and startDate is before this timestamp. Mutually exclusive with cardId.",
                    "schema": { "type": "string" },
                    "required": false,
                  },
                ],
              "responses":
                {
                  "200": { "description": "OK" },
                  "401": { "description": "Authentication required" },
                  "403":
                    {
                      "description": "Forbidden - User not allowed to delete this card(s)",
                    },
                  "404":
                    {
                      "description": "Card not found (when using cardId parameter)",
                    },
                },
            },
        },
      "/cards-publication/cards/{id}":
