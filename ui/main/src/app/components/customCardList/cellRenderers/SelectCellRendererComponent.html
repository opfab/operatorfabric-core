<div [hidden]="!isInputFieldVisible" style="margin: 3px; align-items: center">
    <select
        id="opfab-customcardlist-select"
        [formControl]="cardSelectControl"
        (keydown)="onKeyDown($event)"
        (click)="onClick($event)"
        class="opfab-select"
        style="height: 35px; width: 80%">
        <option *ngFor="let option of selectOptions" [value]="option.value">{{ option.label }}</option>
    </select>
</div>

<div *ngIf="!isInputFieldVisible" style="margin: 3px; align-items: center">{{ fieldValue }}</div>
