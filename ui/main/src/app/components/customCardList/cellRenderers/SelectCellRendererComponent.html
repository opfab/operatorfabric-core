<div [hidden]="!isInputFieldVisible" style="margin: 1px; align-items: center">
    <select
        [hidden]="showOtherInput"
        id="opfab-customcardlist-select"
        [formControl]="cardSelectControl"
        (change)="onSelectChange($event)"
        (keydown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="opfab-select"
        style="height: 35px; width: 80%">
        <option *ngFor="let option of selectOptions" [value]="option.value">{{ option.label }}</option>
        <option *ngIf="allowNewOptionForSelect" value="__other__">{{ otherOptionLabel }}</option>
    </select>
    <input
        #otherInput
        *ngIf="showOtherInput"
        type="text"
        [formControl]="otherInputControl"
        (blur)="addOtherOption()"
        (keydown.enter)="addOtherOption()"
        (keydown.esc)="cancelOtherInput()"
        (click)="$event.stopPropagation()"
        placeholder="{{ otherOptionPlaceholder }}"
        class="opfab-input"
        style="height: 35px; width: 80%" />
</div>

<div
    *ngIf="!isInputFieldVisible"
    style="margin: 0px; align-items: center; text-overflow: ellipsis; overflow: hidden; white-space: nowrap">
    {{ fieldLabel }}
</div>
